[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memmoring-rag"
version = "0.1.0"
description = "Dated-chunk retrieval memory for the Agent Memory Leaderboard"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["memmoring_rag"]
